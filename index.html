<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Jongman Lee, Ph.D. in Architecture.">
<title>Jongman Lee</title>
<style>
:root{--paper:#fcfcfb;--ink:#222;--grey:#6c7075;--faint:#8e9297;--link:#2b4c7e}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif,'Apple Color Emoji','Segoe UI Emoji';font-size:17px;line-height:1.6}
a{color:var(--link);text-decoration:underline;text-decoration-color:rgba(43,76,126,.35);text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{text-decoration-color:currentColor}
a:focus-visible{outline:2px solid var(--link);outline-offset:3px;border-radius:2px}
.page{max-width:760px;margin:0 auto;padding:96px 24px 56px}

h1{font-size:34px;line-height:1.2;font-weight:600;letter-spacing:-.02em;margin:0}
.sub{margin:4px 0 0;color:var(--grey);font-size:19px}
.links{margin:22px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px 24px}
.links li[hidden]{display:none}

section{display:grid;grid-template-columns:160px 1fr;gap:24px;margin-top:72px}
h2{font-size:17px;font-weight:500;margin:0}
.body{max-width:64ch}
.body p{margin:0}
dl{margin:0;display:grid;grid-template-columns:7.5em 1fr;gap:8px 16px}
dt{color:var(--faint)}
dd{margin:0}
.note{color:var(--grey)}

footer{margin-top:112px;font-size:14px;color:var(--faint)}

@media(max-width:600px){
  .page{padding:56px 20px 40px}
  h1{font-size:30px}
  section{grid-template-columns:1fr;gap:10px;margin-top:52px}
  footer{margin-top:80px}
}
@media print{body{background:#fff}.page{padding:0}}
</style>
</head>
<body>
<div class="page">
<header>
<h1>Jongman Lee</h1>
<p class="sub">Ph.D. in Architecture</p>
<ul class="links">
<li data-profile="scholar" hidden><a>Google Scholar</a></li>
<li data-profile="linkedin" hidden><a>LinkedIn</a></li>
<li data-profile="other" hidden><a></a></li>
<li data-profile="email" hidden><a>Email</a></li>
</ul>
</header>

<main>
<section id="background" aria-labelledby="background-heading">
<h2 id="background-heading">Background</h2>
<div class="body">
<dl>
<dt>Education</dt>
<dd>Ph.D. in Architecture<!-- Add institution and year, e.g. ", University name, 20XX" --></dd>
<dt>Experience</dt>
<dd class="note">Being compiled.<!-- Add experience entries here. --></dd>
</dl>
</div>
</section>

<section id="publications" aria-labelledby="publications-heading">
<h2 id="publications-heading">Publications</h2>
<div class="body">
<p class="note">Selected papers will be listed here. The full record is on <a href="https://scholar.google.com/citations?user=6kWZvs4AAAAJ&amp;hl=en">Google Scholar</a>.</p>
<!-- Entry format: <p>Authors. "Title." <i>Venue</i>, Year. <a href="...">PDF</a></p> -->
</div>
</section>

<section id="projects" aria-labelledby="projects-heading">
<h2 id="projects-heading">Projects</h2>
<div class="body">
<p class="note">Being compiled.</p>
</div>
</section>
</main>

<footer>Last updated October 2026</footer>
</div>
<script>
// Profile links. Blank values are hidden.
const profileLinks = {
  scholar: 'https://scholar.google.com/citations?user=6kWZvs4AAAAJ&hl=en',
  linkedin: 'https://www.linkedin.com/in/jongman-lee-956252390/',
  email: '', // e.g. name@example.com (without mailto:)
  other: '',
  otherLabel: 'GitHub'
};
document.querySelectorAll('[data-profile]').forEach(li => {
  const key = li.dataset.profile;
  const value = (profileLinks[key] || '').trim();
  const a = li.querySelector('a');
  if (!value) return;
  if (key === 'email') {
    if (!/^[^\s@?&#]+@[^\s@?&#]+\.[^\s@?&#]+$/.test(value)) return;
    a.href = 'mailto:' + value;
  } else {
    try {
      const url = new URL(value);
      if (url.protocol !== 'https:' && url.protocol !== 'http:') return;
      a.href = url.href;
    } catch (_) { return; }
    if (key === 'other') a.textContent = profileLinks.otherLabel;
  }
  li.hidden = false;
});
</script>
</body>
</html>
