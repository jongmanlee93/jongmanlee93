<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Jongman Lee, Ph.D. in Architecture.">
<title>Jongman Lee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{--paper:#f7f5f0;--ink:#1f1d1a;--muted:#6f6a62;--rule:#cfc9bd;--accent:#8c3b22}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Source Serif 4',Georgia,serif;font-size:18px;line-height:1.6;font-optical-sizing:auto}
a{color:var(--accent);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.page{max-width:720px;margin:0 auto;padding:72px 24px 48px}
h1{font-size:40px;line-height:1.15;font-weight:600;letter-spacing:-.01em;margin:0}
.sub{margin:6px 0 0;color:var(--muted);font-style:italic}
.links{margin:20px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px 0;font-size:16px}
.links li:not([hidden]) ~ li::before{content:'/';color:var(--rule);margin:0 12px}
.links li[hidden]{display:none}
section{display:grid;grid-template-columns:150px 1fr;gap:24px;margin-top:56px;padding-top:14px;border-top:1px solid var(--ink)}
h2{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin:4px 0 0}
section p{margin:0}
dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:6px 20px}
dt{color:var(--muted)}
dd{margin:0}
.note{color:var(--muted)}
footer{margin-top:80px;font-size:14px;color:var(--muted)}
@media(max-width:600px){
  body{font-size:17px}
  .page{padding:44px 20px 36px}
  h1{font-size:32px}
  section{grid-template-columns:1fr;gap:10px;margin-top:40px}
  dl{grid-template-columns:1fr;gap:0}
  dd+dt{margin-top:10px}
}
@media print{body{background:#fff}.page{padding:0}}
</style>
</head>
<body>
<div class="page">
<header>
<h1>Jongman Lee</h1>
<p class="sub">Ph.D. in Architecture</p>
<ul class="links">
<li data-profile="scholar" hidden><a>Google Scholar</a></li>
<li data-profile="linkedin" hidden><a>LinkedIn</a></li>
<li data-profile="other" hidden><a></a></li>
<li data-profile="email" hidden><a>Email</a></li>
</ul>
</header>
<main>
<section id="background" aria-labelledby="background-heading">
<h2 id="background-heading">Background</h2>
<dl>
<dt>Education</dt>
<dd>Ph.D. in Architecture<!-- Add institution and year, e.g. ", University name, 20XX" --></dd>
<dt>Experience</dt>
<dd class="note">In preparation.<!-- Add experience entries here. --></dd>
</dl>
</section>
<section id="publications" aria-labelledby="publications-heading">
<h2 id="publications-heading">Publications</h2>
<p class="note">A selected list will be added here. For now, see <a href="https://scholar.google.com/citations?user=6kWZvs4AAAAJ&amp;hl=en">Google Scholar</a>.</p>
<!-- Entry format: <p>Authors. "Title." <i>Venue</i>, Year. <a href="...">PDF</a></p> -->
</section>
<section id="projects" aria-labelledby="projects-heading">
<h2 id="projects-heading">Projects</h2>
<p class="note">In preparation.</p>
</section>
</main>
<footer>Last updated October 2026</footer>
</div>
<script>
// Profile links. Blank values are hidden.
const profileLinks = {
  scholar: 'https://scholar.google.com/citations?user=6kWZvs4AAAAJ&hl=en',
  linkedin: 'https://www.linkedin.com/in/jongman-lee-956252390/',
  email: '', // e.g. name@example.com (without mailto:)
  other: '',
  otherLabel: 'GitHub'
};
document.querySelectorAll('[data-profile]').forEach(li => {
  const key = li.dataset.profile;
  const value = (profileLinks[key] || '').trim();
  const a = li.querySelector('a');
  if (!value) return;
  if (key === 'email') {
    if (!/^[^\s@?&#]+@[^\s@?&#]+\.[^\s@?&#]+$/.test(value)) return;
    a.href = 'mailto:' + value;
  } else {
    try {
      const url = new URL(value);
      if (url.protocol !== 'https:' && url.protocol !== 'http:') return;
      a.href = url.href;
    } catch (_) { return; }
    if (key === 'other') a.textContent = profileLinks.otherLabel;
  }
  li.hidden = false;
});
</script>
</body>
</html>
